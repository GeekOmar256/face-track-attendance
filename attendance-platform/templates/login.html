<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face Track login</title><link rel="stylesheet" href="/static/style.css"><main class="login card"><h1>Face Track</h1><p>Sign in to the local attendance platform.</p><form id="login"><label>Admin password</label><input id="password" type="password" autocomplete="current-password" required><div class="row"><button>Sign in</button></div></form><p id="message" class="notice"></p></main><script>document.querySelector('#login').onsubmit=async event=>{event.preventDefault();try{const response=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const result=await response.json();if(!response.ok)throw Error(result.error);location.reload()}catch(error){document.querySelector('#message').textContent=error.message}};</script></html>
